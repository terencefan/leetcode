spec:
  replicas: 6
  minReadySeconds: 300
  selector:
    matchLabels:
      app: ingress-nginx1
      pod-template-hash: f87bcc47c
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: ingress-nginx1
        pod-template-hash: f87bcc47c
        type: ingress
    spec:
      volumes:
        - name: telegraf-conf
          configMap:
            name: telegraf
            defaultMode: 420
        - name: mdm-var
          hostPath:
            path: /var/etw
            type: Directory
        - name: pki
          hostPath:
            path: /etc/pki
            type: Directory
      containers:
        - name: nginx
          image: >-
            genevadev.azurecr.io/ingress-controller-shared-standard/controller:202504080232
          args:
            - /nginx-ingress-controller
            - '--default-backend-service=$(POD_NAMESPACE)/default-http-backend'
            - '--configmap=$(POD_NAMESPACE)/nginx-configuration-2x'
            - '--tcp-services-configmap=$(POD_NAMESPACE)/tcp-services'
            - '--udp-services-configmap=$(POD_NAMESPACE)/udp-services'
            - '--default-ssl-certificate=default/service.signalr.net'
            - '--annotations-prefix=nginx.ingress.kubernetes.io'
            - '--ingress-class=nginx1'
            - '--update-status=false'
            - '--election-id=ingress-controller-leader-nginx1'
            - '--controller-class=signalr.net/nginx1'
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: AZURE_REGIONAL_AUTHORITY_NAME
              value: southeastasia
          resources:
            limits:
              cpu: '4'
              memory: 4Gi
            requests:
              cpu: 3500m
          volumeMounts:
            - name: pki
              readOnly: true
              mountPath: /etc/pki
          livenessProbe:
            httpGet:
              path: /healthz
              port: 10254
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 10254
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - curl
                  - '-vvv'
                  - '-XPOST'
                  - http://localhost:18000/shutdown
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
            runAsUser: 101
        - name: graceful-stopper
          image: >-
            genevadev.azurecr.io/ingress-controller-graceful-stopper:202503122040
          command:
            - /graceful-stopper
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
          resources:
            limits:
              cpu: 100m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 18000
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
        - name: telegraf
          image: mcr.microsoft.com/cbl-mariner/base/telegraf:1.29.4-10-cm2.0.20250304
          command:
            - /usr/bin/telegraf
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.hostIP
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: telegraf-conf
              readOnly: true
              mountPath: /etc/telegraf
            - name: mdm-var
              mountPath: /var/etw
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 300
      dnsPolicy: ClusterFirst
      nodeSelector:
        signalr.net/role: ingress
      serviceAccountName: nginx-ingress-serviceaccount
      serviceAccount: nginx-ingress-serviceaccount
      securityContext:
        sysctls:
          - name: net.ipv4.ip_local_port_range
            value: 1024 65535
          - name: net.core.somaxconn
            value: '32768'
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - ingress-nginx1
              topologyKey: kubernetes.io/hostname
      schedulerName: default-scheduler
status:
  replicas: 6
  fullyLabeledReplicas: 6
  readyReplicas: 6
  availableReplicas: 6
  observedGeneration: 6
