apiVersion: v1
data:
  azure-cloud: AzurePublicCloud
  azure-region: southeastasia
  enable-opentelemetry: "true"
  http2-max-field-size: 16k
  http2-max-header-size: 16k
  large-client-header-buffers: 4 16k
  log-format-upstream: '[$remote_addr][$the_real_ip] - $remote_user [$time_local]
    $ssl_protocol/$ssl_cipher $host "$request_method $request_uri_path" $status $body_bytes_sent
    "$req_id" "$opentelemetry_trace_id" "$asrswps_conn_id" "$http_user_agent" $request_length
    $request_time [$proxy_upstream_name] $upstream_addr $upstream_response_length
    $upstream_response_time $upstream_status'
  max-worker-connections: "100000"
  opentelemetry-operation-name: HTTP $request_method $host $request_uri_path
  opentelemetry-trust-incoming-span: "false"
  otel-max-export-batch-size: "512"
  otel-max-queue-size: "5120"
  otel-sampler: AlwaysOn
  otel-sampler-parent-based: "false"
  otel-sampler-ratio: "1.0"
  otel-schedule-delay-millis: "5000"
  otel-service-name: ingress-nginx
  otlp-collector-host: otel-collector.kube-system.svc.cluster.local
  otlp-collector-port: "4317"
  plugins: dynamic_server,signalr_acl
  proxy-connect-timeout: "15"
  proxy-read-timeout: "7200"
  proxy-send-timeout: "7200"
  server-tokens: "false"
  service-tag-data-secret: ingress-nginx/service-tag-data
  signalr-egress-proxy-domain-suffix: egress.svc.kube.dev.signalr.azure.com
  signalr-egress-proxy-secret: ingress-nginx/egress-client
  signalr-first-party-client-id: cdad765c-f191-43ba-b9f5-7aef392f811d
  signalr-first-party-secret: ingress-nginx/first-party
  signalr-first-party-tenant-id: ea8a4392-515e-481f-879e-6571ff2a8a36
  signalr-ingress-auth-secret: ingress-nginx/ingress-client
  signalr-proxy-ssl-name: runtime.dev.signalr.azure.com
  signalr-proxy-ssl-trusted-certificate: /etc/pki/tls/certs/ca-bundle.crt
  signalr-runtime-msi: /subscriptions/29d8a871-a027-432b-ab31-59399f9c0ac9/resourceGroups/rgsignalrdevseasia/providers/Microsoft.ManagedIdentity/userAssignedIdentities/srdevmsirtseasia
  ssl-ciphers: ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256
  trusted-access: "true"
  trusted-access-auth-endpoint: https://login.windows-ppe.net
  worker-processes: "2"
  worker-shutdown-timeout: 1h
